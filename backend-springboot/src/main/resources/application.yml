server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: backend-springboot
  datasource:
    url: ${DB_URL:jdbc:h2:mem:skinlesion_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# Microservices Communication Configuration
services:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  chatbot-service:
    url: ${CHATBOT_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000

# File Upload Configuration
file:
  upload-dir: ${UPLOAD_DIR:uploads}

# OpenAPI Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
